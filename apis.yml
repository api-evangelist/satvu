description: SatVu supplies high‑resolution (up to 3.5 m) thermal infrared imagery captured from its satellite constellation. The data can be
  delivered as still images or video up to 60 seconds and is marketed for use in national security, economic monitoring and climate‑resilience
  applications, including urban heat monitoring and activity detection inside structures day or night.

